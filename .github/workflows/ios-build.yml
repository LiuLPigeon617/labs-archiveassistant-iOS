name: iOS build and simulator smoke

# Two independent jobs:
#   ios-build            - produces an UNSIGNED .ipa for build verification only.
#   ios-simulator-smoke  - runs the app on an iOS Simulator and captures screenshots, so the shared
#                          Compose UI, its fonts and its palette are something you can look at rather
#                          than infer from a green compile.
# They run in parallel and neither is a prerequisite for the other.
#
# An unsigned IPA cannot be installed on a physical device. Installing requires a signing identity
# supplied via repository secrets; that step is intentionally out of scope here so the workflow stays
# useful on forks and public repos. The simulator needs no signing at all, which is why the smoke test
# can run here.

on:
  push:
    branches: [main, "agent/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      configuration:
        description: Build configuration
        required: false
        default: Release
        type: choice
        options: [Debug, Release]

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dkotlin.incremental=false
  JAVA_VERSION: "17"

jobs:
  ios-build:
    name: Build unsigned IPA
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Log runner environment
        run: |
          echo "=== runner ==="
          echo "os:        ${{ runner.os }}"
          echo "arch:      ${{ runner.arch }}"
          echo "ref:       ${{ github.ref }}"
          echo "sha:       ${{ github.sha }}"
          echo "=== toolchain ==="
          sw_vers
          xcodebuild -version
          xcode-select -p
          echo "--- available Xcode versions ---"
          ls /Applications | grep -i xcode || true
          echo "--- available simulators (first 10) ---"
          xcrun simctl list devices available | head -n 10 || true
          echo "=== disk ==="
          df -h /

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: ${{ env.JAVA_VERSION }}

      - name: Cache Gradle and Kotlin/Native artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.konan
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Verify shared kernel (desktop target)
        run: |
          # The JVM target is named `desktop` in shared/build.gradle.kts
          # (jvm("desktop")), so the tasks are compileKotlinDesktop /
          # desktopTest. compileKotlinJvm and jvmTest do not exist.
          echo "=== verifying shared kernel on desktop target ==="
          ./gradlew :shared:compileKotlinDesktop :shared:desktopTest --stacktrace

      - name: Build and stage SharedKit.xcframework
        run: |
          echo "=== available shared tasks matching framework/assemble ==="
          ./gradlew :shared:tasks --all 2>/dev/null | grep -i -E "framework|assemble" || true

          echo "=== assembling SharedKit.xcframework (device + simulator) ==="
          ./gradlew :shared:assembleSharedKitXCFramework --stacktrace

          SRC=$(find shared/build/XCFrameworks -maxdepth 2 -name "SharedKit.xcframework" -type d | head -n 1)
          if [ -z "$SRC" ]; then
            echo "::error::SharedKit.xcframework not found under shared/build/XCFrameworks"
            find shared/build -maxdepth 4 -name "*.xcframework" || true
            exit 1
          fi
          echo "=== built: $SRC ==="
          ls -la "$SRC"

          # Xcode validates a linked .xcframework while planning the build graph, which happens
          # before any run-script phase executes. The framework therefore has to exist at its
          # referenced path before xcodebuild starts, not during the build.
          DEST="iosApp/Frameworks"
          mkdir -p "$DEST"
          rm -rf "$DEST/SharedKit.xcframework"
          cp -R "$SRC" "$DEST/"
          echo "=== staged for Xcode: $DEST/SharedKit.xcframework ==="
          ls -la "$DEST/SharedKit.xcframework"

      - name: Resolve build configuration
        id: config
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CFG="${{ inputs.configuration }}"
          else
            CFG="Release"
          fi
          echo "configuration=$CFG" >> "$GITHUB_OUTPUT"
          echo "=== using configuration: $CFG ==="

      - name: Build unsigned .app
        run: |
          set -o pipefail
          CFG="${{ steps.config.outputs.configuration }}"
          DERIVED=build/DerivedData

          echo "=== schemes and targets visible to xcodebuild ==="
          xcodebuild -project iosApp/iosApp.xcodeproj -list || true

          echo "=== xcodebuild archive ( CODE_SIGNING_ALLOWED=NO ) ==="
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration "$CFG" \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$DERIVED" \
            -archivePath build/聚合拾遗.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE="" \
            -allowProvisioningUpdates \
            clean archive 2>&1 | tee build-xcodebuild.log | tail -n 40

          echo "=== archive contents ==="
          find build/聚合拾遗.xcarchive -maxdepth 3 -name "*.app" | sort

      - name: Package unsigned .ipa
        run: |
          set -euo pipefail
          CFG="${{ steps.config.outputs.configuration }}"
          APP=$(find build/聚合拾遗.xcarchive -maxdepth 3 -name "*.app" -type d | head -n 1)

          if [ -z "$APP" ]; then
            echo "::error::No .app found inside the archive; cannot package an IPA."
            exit 1
          fi
          echo "=== packaging app: $APP ==="

          mkdir -p build/Payload
          cp -R "$APP" build/Payload/

          IPA="build/聚合拾遗-unsigned-${{ github.sha }}.ipa"
          # -y preserves symlinks; zip must run from build/ so Payload sits at the archive root.
          (cd build && zip -qry "$(basename "$IPA")" Payload)

          echo "=== ipa ==="
          ls -lh "$IPA"
          unzip -l "$IPA" | head -n 12

          # This is the artifact people actually install, so verify the shipped app carries what
          # Compose needs at launch rather than trusting the build phases that were supposed to add it.
          echo "=== shipped-app preconditions ==="
          SHIPPED=$(find build/Payload/聚合拾遗.app -maxdepth 0 -type d || true)
          if [ -z "$SHIPPED" ]; then
            echo "::error::Payload/聚合拾遗.app missing before packaging"
            exit 1
          fi
          FONTS=$(find "$SHIPPED/compose-resources" -type f -name '*.ttf' 2>/dev/null | wc -l | tr -d ' ')
          echo "compose-resources font files: $FONTS"
          if [ "$FONTS" -lt 1 ]; then
            echo "::error::the packaged app has no compose-resources fonts."
            echo "::error::Compose aborts at launch with MissingResourceException, so this IPA would crash"
            echo "::error::on any device. Check that :shared:syncComposeResourcesForIos ran during archiving."
            exit 1
          fi
          if /usr/libexec/PlistBuddy -c "Print :CADisableMinimumFrameDurationOnPhone" "$SHIPPED/Info.plist" 2>/dev/null | grep -qi true; then
            echo "CADisableMinimumFrameDurationOnPhone = true"
          else
            echo "::error::the packaged app's Info.plist lacks CADisableMinimumFrameDurationOnPhone."
            exit 1
          fi

          echo "ipa_path=$IPA" >> "$GITHUB_ENV"

      - name: Summarize build
        run: |
          echo "=== BUILD SUMMARY ==="
          echo "configuration : ${{ steps.config.outputs.configuration }}"
          echo "ipa           : ${{ env.ipa_path }}"
          echo "signing       : NONE (unsigned; not installable on a device)"
          echo ""
          echo "=== last warnings/errors from xcodebuild ==="
          grep -E "(error|warning):" build-xcodebuild.log | tail -n 25 || echo "(none)"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: JuHeShiYi-unsigned-ipa-${{ steps.config.outputs.configuration }}
          path: build/*.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: build-xcodebuild.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-test-results
          path: shared/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 14

  # -------------------------------------------------------------------------------------------------
  # Simulator smoke test
  #
  # Deliberately a separate job rather than steps appended to ios-build: a rendering regression and a
  # packaging regression are different things, and a failure here should be unambiguous. Running in
  # parallel also keeps this off the critical path of the IPA.
  # -------------------------------------------------------------------------------------------------
  ios-simulator-smoke:
    name: Simulator smoke (screenshots)
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Log simulator inventory
        run: |
          echo "arch: ${{ runner.arch }}"
          xcrun simctl list runtimes || true
          echo "--- devices ---"
          xcrun simctl list devices available | head -n 40 || true

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: ${{ env.JAVA_VERSION }}

      - name: Cache Gradle and Kotlin/Native artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.konan
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Xcode validates a linked .xcframework while planning the build graph, which happens before any
      # run-script phase executes, so the framework has to exist at its referenced path first. Same
      # staging as the IPA job; the XCFramework carries both device and simulator slices.
      - name: Build and stage SharedKit.xcframework
        run: |
          echo "=== assembling SharedKit.xcframework (device + simulator) ==="
          ./gradlew :shared:assembleSharedKitXCFramework --stacktrace

          SRC=$(find shared/build/XCFrameworks -maxdepth 2 -name "SharedKit.xcframework" -type d | head -n 1)
          if [ -z "$SRC" ]; then
            echo "::error::SharedKit.xcframework not found under shared/build/XCFrameworks"
            find shared/build -maxdepth 4 -name "*.xcframework" || true
            exit 1
          fi

          DEST="iosApp/Frameworks"
          mkdir -p "$DEST"
          rm -rf "$DEST/SharedKit.xcframework"
          cp -R "$SRC" "$DEST/"
          echo "=== staged for Xcode: $DEST/SharedKit.xcframework ==="
          ls -la "$DEST/SharedKit.xcframework"

      - name: Build for the iOS Simulator
        run: |
          set -o pipefail

          # ARCHS=arm64 is explicit: the shared kernel declares iosSimulatorArm64 only, so building the
          # x86_64 slice too would fail to link. The runner is arm64; simulator-smoke.sh re-checks that.
          #
          # No signing overrides here, unlike the archive build: the iOS Simulator SDK expects an
          # ad-hoc signature, and simctl install accepts the default product. Forcing
          # CODE_SIGNING_ALLOWED=NO would produce an unsigned bundle for no benefit.
          echo "=== xcodebuild build ( iOS Simulator, Debug ) ==="
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build/SimDerivedData \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            build 2>&1 | tee build-simulator-xcodebuild.log | tail -n 40

          APP="build/SimDerivedData/Build/Products/Debug-iphonesimulator/聚合拾遗.app"
          if [ ! -d "$APP" ]; then
            echo "::error::simulator app not found at $APP"
            find build/SimDerivedData/Build/Products -maxdepth 2 -name "*.app" || true
            exit 1
          fi
          echo "=== built: $APP ==="

          # Compose Multiplatform aborts at process start unless two things hold: the plist key below,
          # and a populated compose-resources directory in the bundle. Both were caught by the smoke
          # test rather than by the build, so both are asserted here.
          echo "=== Compose plist precondition ==="
          PLIST="$APP/Info.plist"
          if [ ! -f "$PLIST" ]; then
            echo "::error::no Info.plist inside $APP"
            exit 1
          fi
          if /usr/libexec/PlistBuddy -c "Print :CADisableMinimumFrameDurationOnPhone" "$PLIST" 2>/dev/null | grep -qi true; then
            echo "CADisableMinimumFrameDurationOnPhone = true (Compose will start)"
          else
            echo "::error::CADisableMinimumFrameDurationOnPhone is missing or not true in the built Info.plist."
            echo "::error::Compose Multiplatform aborts on launch without it - see PlistSanityCheck.uikit.kt."
            /usr/libexec/PlistBuddy -c "Print" "$PLIST" || true
            exit 1
          fi

          echo "=== Compose resources precondition ==="
          if [ -d "$APP/compose-resources" ] && [ -n "$(find "$APP/compose-resources" -type f -name '*.ttf' 2>/dev/null | head -n 1)" ]; then
            echo "compose-resources present with fonts:"
            find "$APP/compose-resources" -type f | head -n 10
          else
            echo "::error::the built app has no compose-resources directory (or no fonts in it)."
            echo "::error::Compose serves archiveFontFamily from there and aborts with MissingResourceException."
            echo "::error::The sync runs as the 'Build SharedKit.xcframework' build phase; check that"
            echo "::error:::shared:syncComposeResourcesForIos ran for this configuration."
            find "$APP" -maxdepth 1 || true
            exit 1
          fi

          echo "=== signature ==="
          codesign -dv --verbose=2 "$APP" 2>&1 || true

      - name: Run simulator smoke test
        run: ./.github/scripts/simulator-smoke.sh

      - name: Upload simulator screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-smoke
          path: |
            build/simulator-smoke/*.png
            build/simulator-smoke/*.txt
            build/simulator-smoke/*.log
            build/simulator-smoke/summary.md
            build/simulator-smoke/*.ips
          if-no-files-found: warn
          retention-days: 14

      - name: Upload simulator build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-xcodebuild-log
          path: build-simulator-xcodebuild.log
          if-no-files-found: ignore
          retention-days: 14
